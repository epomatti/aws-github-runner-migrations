write_files:
  - path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    permissions: "0644"
    source:
      uri: https://cli.github.com/packages/githubcli-archive-keyring.gpg

  - path: /etc/apt/sources.list.d/github.sources
    permissions: "0644"
    content: |
      Types: deb
      URIs: https://cli.github.com/packages
      Suites: stable
      Components: main
      Signed-By: /etc/apt/keyrings/githubcli-archive-keyring.gpg

package_update: true
packages:
  - gh
