## template: jinja
#cloud-config

write_files:
  - path: /etc/apt/keyrings/docker.asc
    permissions: "0644"
    source:
      uri: https://download.docker.com/linux/ubuntu/gpg

  - path: /etc/apt/sources.list.d/docker.sources
    permissions: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: resolute
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc

package_update: true
packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
