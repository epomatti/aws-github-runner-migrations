- name: Coding environment
  hosts: localhost
  connection: local
  become: true

  vars:
    apt_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
    runner_user: "runner"
    kubernetes_version: "v1.37"

  tasks:
    - name: Directories and file setup
      ansible.builtin.include_tasks: tasks/files.yaml

    - name: Users
      ansible.builtin.include_tasks: tasks/users.yaml

    - name: Keys
      ansible.builtin.include_tasks: tasks/keys.yaml

    - name: Repositories
      ansible.builtin.include_tasks: tasks/repositories.yaml

    - name: APT packages
      ansible.builtin.include_tasks: tasks/packages.yaml

    - name: Services
      ansible.builtin.include_tasks: tasks/services.yaml

    - name: Docker setup
      ansible.builtin.include_tasks: tasks/docker.yaml

  handlers:
    - name: Restart docker
      become: true
      ansible.builtin.systemd_service:
        name: docker
        state: restarted

    - name: Restart containerd
      become: true
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
