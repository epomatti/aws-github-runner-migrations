---
- name: Coding environment
  hosts: localhost
  connection: local
  become: true

  vars:
    apt_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
    target_user: "{{ lookup('env', 'SUDO_USER') | default(ansible_facts['user_id'], true) }}"

    kubernetes_version: "v1.34"

  tasks:
    - name: Directories and file setup
      ansible.builtin.include_tasks: tasks/files.yaml

    - name: Users
      ansible.builtin.include_tasks: tasks/users.yaml

