- name: Install build tools
  ansible.builtin.apt:
    update_cache: true
    pkg:
      # Essential packages for apt and system setup
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - build-essential
      - bind9-dnsutils

      # Development tools and CLIs
      - gh
      - kubectl
      - helm
      - jq
      - yq
      - unzip

      # Docker
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
