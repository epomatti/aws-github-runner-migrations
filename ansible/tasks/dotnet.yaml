---
# Installs the Aspire CLI into /home/{{ target_user }}/.dotnet/tools/aspire
# No supported Ansible module exists for 'dotnet tool'; command + creates is the idiomatic fallback.
- name: Install Aspire CLI
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    cmd: dotnet tool install --global Aspire.Cli
    creates: "/home/{{ target_user }}/.dotnet/tools/aspire"

# Optional: Symlink binary globally so 'aspire' works system-wide
- name: Create global symlink for Aspire CLI
  ansible.builtin.file:
    src: "/home/{{ target_user }}/.dotnet/tools/aspire"
    dest: /usr/local/bin/aspire
    state: link

- name: Install dotnet-ef
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    cmd: dotnet tool install --global dotnet-ef
    creates: "/home/{{ target_user }}/.dotnet/tools/dotnet-ef"

- name: Install CSharpier
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    cmd: dotnet tool install --global csharpier
    creates: "/home/{{ target_user }}/.dotnet/tools/csharpier"
