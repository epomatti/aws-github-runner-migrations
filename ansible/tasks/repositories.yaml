# Required by deb822_repository
- name: Install python3-debian
  ansible.builtin.apt:
    name: python3-debian
    update_cache: true

- name: Add GitHub CLI repository
  ansible.builtin.deb822_repository:
    name: github-cli
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: "{{ apt_arch }}"
    signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    state: present

- name: Add HashiCorp repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: "{{ apt_arch }}"
    signed_by: /etc/apt/keyrings/hashicorp.asc
    state: present

- name: Add Docker CE repository
  ansible.builtin.deb822_repository:
    name: docker
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ apt_arch }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Add Microsoft prod repository
  ansible.builtin.deb822_repository:
    name: microsoft-prod
    uris: "https://packages.microsoft.com/ubuntu/{{ ansible_facts['distribution_version'] }}/prod"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: "{{ apt_arch }}"
    signed_by: /etc/apt/keyrings/microsoft-prod.asc
    state: present

- name: Add Azure CLI repository
  ansible.builtin.deb822_repository:
    name: azure-cli
    uris: https://packages.microsoft.com/repos/azure-cli/
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: "{{ apt_arch }}"
    signed_by: /etc/apt/keyrings/microsoft-prod.asc
    state: present

# Flat repository (suite is '/'), as documented at kubernetes.io
- name: Add Kubernetes repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    uris: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/"
    suites: /
    architectures: "{{ apt_arch }}"
    signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    state: present

- name: Add Helm repository
  ansible.builtin.deb822_repository:
    name: helm-debian
    uris: https://packages.buildkite.com/helm-linux/helm-debian/any/
    suites: any
    components: main
    signed_by: /etc/apt/keyrings/helm.asc
    state: present
